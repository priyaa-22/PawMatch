# ==============================================================================
# PawMatch Hardened Root Render Blueprint (Infrastructure-as-Code)
# ==============================================================================

services:
  - type: web
    name: pawmatch-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health/
    envVars:
      # Framework & Runtime Flags
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONFAULTHANDLER
        value: "1"

      # Secrets Management (Never Hardcode Credentials)
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: ACCOUNTS_EMAIL_PROVIDER
        value: "BREVO_API"
      - key: EMAIL_VERIFICATION_MODE
        value: "FIXED"
      - key: EMAIL_VERIFICATION_FIXED_OTP
        value: "6767"



      # Network Security & Host Permissions
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"

      # Gunicorn Concurrency & Timeout Configuration
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "60"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "30"

      # Telemetry & Structured Logging
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FORMAT
        value: "json"
